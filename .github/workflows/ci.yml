name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Test (builds, then type-checks and runs the tests)
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Package contents
        run: npm pack --dry-run
